  </head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-11 h-11 -ml-space-xs flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high/60 transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="Early Runner Brand Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCl79KNgqDwpU2RA0YDcSGc-mOAQVoT0mfLDDzAEpBTUlLQ47wM_XMF77gT8Y6klVpW4yHAS7TKwsPsfyd7Uw--I9mehYzVDRHl6rKsPcOmDx0wijofzZnykDrAYX3WGaQFC_TlErK00uMreGSWVTuImT_lShnJy-NS829LC72NBtR8M-4AgH287N_U1_nJU1jj9lAHi-_1vk_ThXeGtABqENlwXJgQwkoGVIr_Se5oRRfkkVhX4jlW"><h1 class="font-headline-sm text-headline-sm text-on-surface ml-1">Active Morning Run</h1></div><div class="flex items-center"><button class="w-11 h-11 flex items-center justify-center rounded-full hover:opacity-90 transition-opacity" type="button"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCW9rUJalMilkZLb5N1_SqCZqgFg76bFvn7NXo02dJiMa7WIZRH3QocwIhRsJgCn4XwQAm5f0WlAZO4N02ocZVi7Tx4mkRqEFz1_v5AaAcD6GfMxrZeX7gN3RJicSswsPyaV9E2_8MoirkvL9WBZScATwZAlNjH3EOO0kP-23FEqf_7BI_47gNuE1cgLrgYJrBICwGU13qH9fWRf1pX5TST5t0dqCK-PrZyfAl3YqgVeWdCCGsPVyxW"></button></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface px-margin"><div class="flex flex-col w-full relative pb-8">

<div class="flex items-center justify-between mb-space-sm">
<div class="h-4 w-28 bg-surface-container-high rounded-full"></div>
<div class="h-6 w-16 bg-surface-container-high rounded-full"></div>
</div>
<div class="grid grid-cols-2 gap-space-sm">
<div class="h-20 bg-surface-container rounded-xl"></div>

</div>
</div>
<!-- Bottom Sheet Container (Level 2 Elevation with Dawn Bloom) -->
<div class="relative w-full bg-surface-container-low rounded-t-[28px] rounded-b-2xl p-margin flex flex-col gap-space-md transition-all duration-300" id="checkinModal">
<!-- Drag Handle / Dismiss Indicator -->

<div class="w-12 h-1.5 rounded-full bg-surface-bright/80 hover:bg-outline/50 transition-colors cursor-grab active:cursor-grabbing"></div>

</div>
<!-- Sheet Header -->
<div class="flex items-start justify-between">
<div class="flex flex-col">
<div class="flex items-center gap-2">
<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-primary-container/20 text-primary text-[14px]">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">wb_twilight</span>
</span>
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">Day 8 Check-in</h2>
</div>

</div>
<!-- Close Action -->

</button>
</div>
<!-- Two Tactile Toggle Cards -->
<div class="flex flex-col gap-3">
<!-- Toggle 1: Wake Up Early -->
<label class="flex items-center justify-between p-3 rounded-xl bg-surface-container hover:bg-surface-container-high transition-colors cursor-pointer"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-surface-container-high flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[20px]">alarm</span></div><div class="flex flex-col"><span class="font-label-md text-on-surface font-medium">Woke up early</span><span class="font-body-sm text-[12px] text-on-surface-variant">Target: 5:30 AM <span class="text-tertiary">(5:28 AM)</span></span></div></div><input checked="" class="peer sr-only" id="toggleWake" type="checkbox"><div class="w-11 h-6 bg-surface-variant rounded-full peer peer-checked:bg-primary/80 transition-colors relative after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-on-surface after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div></label>
<!-- Toggle 2: Completed Workout -->
<label class="flex items-center justify-between p-3 rounded-xl bg-surface-container hover:bg-surface-container-high transition-colors cursor-pointer"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-surface-container-high flex items-center justify-center text-tertiary"><span class="material-symbols-outlined text-[20px]">directions_run</span></div><div class="flex flex-col"><span class="font-label-md text-on-surface font-medium">Completed workout</span><span class="font-body-sm text-[12px] text-on-surface-variant">Morning outdoor session</span></div></div><input checked="" class="peer sr-only" id="toggleRun" type="checkbox"><div class="w-11 h-6 bg-surface-variant rounded-full peer peer-checked:bg-tertiary/80 transition-colors relative after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-on-surface after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div></label>
</div>
<!-- Celebratory Banner Badge (Dynamic State) -->
<div class="rounded-xl bg-surface-container-low px-3 py-2.5 flex items-center justify-between border-0 transition-opacity" id="celebrationBadge"><div class="flex items-center gap-2.5 min-w-0"><span class="material-symbols-outlined text-primary text-[18px]">check_circle</span><div class="flex flex-col min-w-0"><span class="font-label-md text-on-surface font-medium truncate">Day 8 Goal Achieved</span><span class="font-body-sm text-[11px] text-on-surface-variant">100% adherence • 8 of 21 logged</span></div></div><span class="font-label-sm text-[11px] text-tertiary font-medium">Streak on track</span></div>
<!-- Activity Mode Segmented Tab -->
<div class="flex flex-col gap-1.5">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Session Intensity</span>
<div class="grid grid-cols-2 p-1 bg-surface-container rounded-xl gap-1"><button class="py-1.5 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center gap-1.5" id="tabJog" type="button"><span class="material-symbols-outlined text-[16px]">directions_walk</span><span class="">Jog / Recovery</span></button><button class="py-1.5 rounded-lg font-label-md text-label-md bg-surface-bright text-on-surface font-semibold flex items-center justify-center gap-1.5 transition-colors" id="tabRun" type="button"><span class="material-symbols-outlined text-[16px] text-primary">bolt</span><span class="">Run (Active)</span></button></div>
</div>
<!-- Duration Control Section -->
<div class="p-3 rounded-xl bg-surface-container flex flex-col gap-2.5"><div class="flex items-center justify-between"><span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Duration</span><div class="flex items-baseline gap-1"><span class="font-headline-sm text-[20px] text-on-surface font-semibold" id="durationVal">36</span><span class="font-body-sm text-[12px] text-on-surface-variant">min</span></div></div><div class="relative flex items-center py-1"><input class="w-full h-1.5 bg-surface-variant rounded-full appearance-none cursor-pointer accent-primary" id="durationSlider" max="90" min="10" step="1" type="range" value="36"></div><div class="flex items-center justify-end gap-2 pt-0.5"><button class="px-2.5 py-1 rounded-lg bg-surface-container-high hover:bg-surface-bright text-on-surface-variant hover:text-on-surface font-label-sm text-[12px] transition-colors" onclick="adjustDuration(5)" type="button">+5m</button><button class="px-2.5 py-1 rounded-lg bg-surface-container-high hover:bg-surface-bright text-on-surface-variant hover:text-on-surface font-label-sm text-[12px] transition-colors" onclick="adjustDuration(15)" type="button">+15m</button></div></div>
<!-- Distance Control Section -->
<div class="p-3 rounded-xl bg-surface-container flex flex-col gap-2.5"><div class="flex items-center justify-between"><span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Distance</span><div class="flex items-center gap-2"><button aria-label="Decrease distance" class="w-7 h-7 rounded-lg bg-surface-container-high hover:bg-surface-bright text-on-surface-variant hover:text-on-surface flex items-center justify-center text-sm transition-colors" onclick="adjustDistance(-0.1)" type="button">−</button><div class="flex items-baseline gap-1 min-w-[64px] justify-center"><span class="font-headline-sm text-[20px] text-on-surface font-semibold" id="distanceVal">4.8</span><span class="font-body-sm text-[12px] text-on-surface-variant">km</span></div><button aria-label="Increase distance" class="w-7 h-7 rounded-lg bg-surface-container-high hover:bg-surface-bright text-on-surface-variant hover:text-on-surface flex items-center justify-center text-sm transition-colors" onclick="adjustDistance(0.1)" type="button">+</button></div></div><div class="relative flex items-center py-1"><input class="w-full h-1.5 bg-surface-variant rounded-full appearance-none cursor-pointer accent-primary" id="distanceSlider" max="15.0" min="1.0" step="0.1" type="range" value="4.8"></div><div class="flex items-center justify-between pt-0.5 text-on-surface-variant"><span class="font-label-sm text-[12px]">Average Pace</span><span class="font-label-md text-[13px] text-on-surface font-medium" id="paceVal">7'30" /km</span></div></div>
<!-- Visual Storytelling / Dawn Aura Badge -->

<!-- Primary Action Stadium Button -->
<div class="pt-1">
<button class="w-full h-12 rounded-xl bg-primary text-on-primary font-label-md text-label-md font-semibold flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all" id="saveBtn" type="button"><span class="material-symbols-outlined text-[18px]">check</span><span class="">Save check-in</span></button>
<div class="text-center mt-2.5">
<span class="font-label-sm text-label-sm text-outline tracking-wider uppercase">Auto-syncs with Strava &amp; Apple Health</span>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const durationSlider = document.getElementById('durationSlider');
    const durationVal = document.getElementById('durationVal');
    const distanceSlider = document.getElementById('distanceSlider');
    const distanceVal = document.getElementById('distanceVal');
    const paceVal = document.getElementById('paceVal');
    const toggleWake = document.getElementById('toggleWake');
    const toggleRun = document.getElementById('toggleRun');
    const celebrationBadge = document.getElementById('celebrationBadge');
    const saveBtn = document.getElementById('saveBtn');

    function calculatePace(minutes, km) {
      if (!km || km <= 0) return "--'--\" /km";
      const totalSeconds = (minutes * 60) / km;
      const paceMin = Math.floor(totalSeconds / 60);
      const paceSec = Math.round(totalSeconds % 60);
      const formattedSec = paceSec < 10 ? '0' + paceSec : paceSec;
      return `${paceMin}'${formattedSec}" /km`;
    }

    function updatePace() {
      const dur = parseFloat(durationSlider.value);
      const dist = parseFloat(distanceSlider.value);
      paceVal.textContent = calculatePace(dur, dist);
    }

    durationSlider.addEventListener('input', function (e) {
      durationVal.textContent = e.target.value;
      updatePace();
    });

    distanceSlider.addEventListener('input', function (e) {
      distanceVal.textContent = parseFloat(e.target.value).toFixed(1);
      updatePace();
    });

    window.adjustDuration = function (mins) {
      let current = parseInt(durationSlider.value, 10);
      let updated = Math.min(90, Math.max(10, current + mins));
      durationSlider.value = updated;
      durationVal.textContent = updated;
      updatePace();
    };

    window.adjustDistance = function (step) {
      let current = parseFloat(distanceSlider.value);
      let updated = Math.min(15.0, Math.max(1.0, current + step));
      distanceSlider.value = updated.toFixed(1);
      distanceVal.textContent = updated.toFixed(1);
      updatePace();
    };

    function checkAdherence() {
      if (toggleWake.checked && toggleRun.checked) {
        celebrationBadge.classList.remove('opacity-40', 'grayscale');
      } else {
        celebrationBadge.classList.add('opacity-40', 'grayscale');
      }
    }

    toggleWake.addEventListener('change', checkAdherence);
    toggleRun.addEventListener('change', checkAdherence);

    saveBtn.addEventListener('click', function () {
      saveBtn.classList.add('scale-95');
      setTimeout(function () {
        saveBtn.classList.remove('scale-95');
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">done_all</span><span>Saved & Streak Locked!</span>';
        saveBtn.classList.add('from-tertiary-container', 'to-tertiary');
      }, 180);
    });
  })();
</script></main>
